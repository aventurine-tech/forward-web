name: Fetch legacy images

# One-off helper: downloads the images listed in scripts/legacy-assets.txt from the
# old forward.md site into public/ and commits them, so the new site does not depend
# on the old server. Runs when that list changes, or by hand.
on:
  push:
    paths: [scripts/legacy-assets.txt, .github/workflows/fetch-assets.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          grep -v '^#' scripts/legacy-assets.txt | while read -r dest url; do
            [ -n "$dest" ] || continue
            mkdir -p "public/$(dirname "$dest")"
            if curl -fsSL --retry 3 -A "Mozilla/5.0" -o "public/$dest" "$url"; then
              echo "ok   $dest"
            else
              echo "::warning::failed $url"; rm -f "public/$dest"
            fi
          done
          # Reference files are for design work only, not part of the site.
          mkdir -p design && rm -rf design/reference && mv public/reference design/reference 2>/dev/null || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add public design
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add images from the old forward.md site"
          git push
